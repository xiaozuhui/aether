[package]
name = "aether-azathoth"
version = "0.6.0"
edition = "2024"
authors = ["xiaozuhui <xiaozuhui@outlook.com>"]
description = "A lightweight, embeddable domain-specific language (DSL) interpreter with rich standard library"
license = "BUSL-1.1"
repository = "https://github.com/xiaozuhui/aether"
documentation = "https://docs.rs/aether-azathoth/latest/aether/"
homepage = "https://github.com/xiaozuhui/aether"
readme = "README.md"
keywords = ["dsl", "interpreter", "scripting", "language"]
categories = ["parser-implementations", "development-tools"]
exclude = [
    "target/*",
    ".git/*",
    ".github/*",
    "examples/*.aether",
    "docs/*",
    "scripts/*",
    "tests/*",
    ".idea/*",
    ".claude/*",
]

[lib]
name = "aether"
doctest = true

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
num-rational = "0.4"
num-traits = "0.2"
num-bigint = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# 异步支持（可选）
tokio = { version = "1.53.1", features = ["rt", "sync"], optional = true }

[features]
default = []
# 异步支持
async = ["tokio"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }

[[example]]
name = "async_demo"
required-features = ["async"]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
